<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Globe</title>
    <link rel="stylesheet" href="./globe.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050506;
        color: #b8b3a6;
        font:
          15px/1.45 system-ui,
          sans-serif;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      /* Viewer only: the hint and the Devastation slider, which an Implementation does not copy. */
      #viewer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }
      #hint {
        font-size: 13px;
        color: #9c978a;
      }
      #devastation {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: #e8e4d8;
      }
      #devastation input {
        width: 260px;
        accent-color: #ff7a1a;
      }
      #devastation output {
        min-width: 3ch;
        font-family: ui-monospace, Consolas, monospace;
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <div id="viewer">
      <label id="devastation">
        Devastation
        <input id="devastation-level" type="range" min="0" max="100" step="1" value="0" />
        <output id="devastation-shown" for="devastation-level">0%</output>
      </label>
      <div id="hint">Drag to orbit · scroll to zoom</div>
    </div>
    <script type="module">
      import { mountGlobe } from './globe.js'

      const globe = mountGlobe(document.getElementById('stage'))

      // The devastation an Implementation would set from the game; `?devastation=60` in the address starts with it.
      const devastationLevel = document.getElementById('devastation-level')
      const devastationShown = document.getElementById('devastation-shown')
      const showDevastation = () => {
        devastationShown.textContent = `${devastationLevel.value}%`
        globe.setDevastation(devastationLevel.value / 100)
      }
      devastationLevel.value = new URLSearchParams(location.search).get('devastation') ?? '0'
      devastationLevel.addEventListener('input', showDevastation)
      showDevastation()
    </script>
  </body>
</html>
