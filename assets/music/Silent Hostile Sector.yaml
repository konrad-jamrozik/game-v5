prompt: |-
  Dark, ominous, atmospheric 1990s science-fiction strategy game soundtrack, inspired by the original X-COM: UFO Defense (1994).

  Authentic retro MIDI and Amiga-era synthesizer sound. Eerie electronic music with haunting minor-key melodies, deep ominous harmonies, unsettling dissonance, and mysterious alien textures.

  Cold, sinister, hypnotic, and deeply unsettling. Evoke paranoia, isolation, dread, and the constant threat of an unknown extraterrestrial enemy. Serious and threatening, never cheerful, uplifting, or comforting.

  Slow tempo, approximately 55–65 BPM, sparse instrumentation, subdued dynamics, and restrained intensity. Gradual melodic and atmospheric evolution, with subtle musical variety and an unpredictable sense of danger. Avoid energetic rhythms, upbeat melodies, and dramatic crescendos.

  Instrumental background music for extended strategic gameplay. Vintage 1990s PC game aesthetic, emphasizing psychological tension and fear of the unknown rather than action, heroism, or excitement.
