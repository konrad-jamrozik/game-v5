prompt: |-
  Dark, brooding tactical strategy game soundtrack with deep bowed double bass and sparse bowed cymbal resonances. Subterranean, oppressive, ominous, and deeply unsettling.

    Minimalist arrangement dominated by low contrabass drones, slow dissonant string vibrations, and ample negative space. Barely audible bowed cymbals add distant metallic groans and soft, dark resonances. Bow the cymbals rather than striking them: no crashes, rhythmic cymbal patterns, or bright shimmering washes.

    Evoke clandestine surveillance, isolation, and something dangerous moving beyond sight. Organic, gritty, grounded acoustic textures; minimal melody, subtle harmonic shifts, and slowly evolving tension.

    Very slow pacing, restrained dynamics, and consistent low intensity. Unobtrusive background music suitable for prolonged strategy gameplay and looping. No driving beat, dramatic builds, climaxes, jump scares, or abrupt ending.
