prompt: |-
  Dark, atmospheric 1990s science-fiction tactical strategy game soundtrack, inspired by the original X-COM: UFO Defense (1994) and X-COM: Terror from the Deep (1995), with subtle Lovecraftian cosmic horror influences.

  Authentic retro MIDI and Amiga-era synthesizer sound, vintage Sound Blaster FM synthesis, eerie ambient electronic music, ominous low-frequency drones, haunting minor-key melodies, sparse metallic percussion, unsettling dissonant synth chords, strange alien electronic textures, and subtle pulsing bass sequences.

  Create an atmosphere of paranoia, isolation, mystery, and constant extraterrestrial threat, with an undercurrent of ancient, incomprehensible evil lurking beneath the surface. Suggest the oppressive darkness of the deep ocean, forgotten underwater civilizations, cyclopean ruins, and dormant cosmic entities through distant, muffled resonances, eerie sonar-like pulses, abyssal drones, and unnatural harmonic textures.

  Minimalist, cold, hypnotic, and deeply unsettling, with restrained melodic development and an unpredictable sense of danger. Slow to moderate tempo, sparse arrangement, deliberate silences, occasional eerie high-pitched electronic tones, and subtle, almost subliminal moments of cosmic dread.

  Emphasize psychological tension, exploration, and fear of the unknown rather than action or heroism. The Lovecraftian and deep-sea horror elements should remain subtle, enriching the original X-COM atmosphere rather than dominating it.

  Vintage 1990s PC game synthesizer aesthetic, slightly lo-fi digital instrumentation, limited polyphony, short repeating melodic motifs, and early PC game soundtrack production. No modern cinematic orchestration, no epic percussion, no guitars, no vocals, no dramatic crescendos.

  Instrumental background music designed for long tactical gameplay sessions. Subtle variation, consistent atmosphere, memorable but understated motifs, and seamless looping without a dramatic introduction or ending.
