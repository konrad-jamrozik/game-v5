prompt: |-
  Dark, atmospheric 1990s science-fiction tactical strategy game soundtrack, inspired by the original X-COM: UFO Defense (1994). Authentic retro MIDI and Amiga-era synthesizer sound, eerie ambient electronic music, ominous low-frequency drones, haunting minor-key melodies, sparse metallic percussion, unsettling dissonant synth chords, strange alien electronic textures, and subtle pulsing bass sequences.

    Create an atmosphere of paranoia, isolation, mystery, and constant extraterrestrial threat. Minimalist, cold, hypnotic, and deeply unsettling, with restrained melodic development and an unpredictable sense of danger. Slow to moderate tempo, sparse arrangement, deliberate silences, and occasional eerie high-pitched electronic tones.

    Emphasize psychological tension and the fear of the unknown rather than action or heroism. Vintage 1990s PC game synthesizer aesthetic, slightly lo-fi digital
