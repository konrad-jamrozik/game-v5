notes: |-
  Claude Code rewrote the prompt of S6 XCOM+AllowEpic+NoSynth+ModMil on the request in `meta_prompt`, as the Game designer found its songs too fast and too generic military; the request names that track by its earlier draft name, S6 XCOM+NoDrones+AllowEpic+NoSynth+ModMil. Slow set the tempo to around 65 BPM instead of "slow to moderate". Space set the scene in an orbital command center and replaced the staccato string ostinatos, tight snare rolls, and taiko hits with glassy string harmonics, bowed metal, sonar-like pings, radio static, and console-like ticking, keeping the snare only distant and sparse; Space supersedes ModMil, which is therefore not listed. In the Exclude styles, Claude Code took out electronic, so that the high-tech textures can sound, keeping synthesizer for NoSynth, and added military march and fast tempo. The Game designer edited Claude Code's draft before generating: from the draft's Variety Off to High, and dropping the take letter from the draft's name. `prompt` is the Styles text Suno stored, not the one pasted in: Suno's Variety at High (`suno_variety: '2 - High / Distinct styles'`, stored by Suno as `aug_creativity: 2`) rewrote it, differently for each variation. Suno's clip data holds no Weirdness value, as it omits the default of 50%; `suno_weirdness` is the value the Game designer set. `created`, `length`, `model`, `tags`, Style influence, and Variety come from Suno's clip data for the song; `created` is its UTC creation time converted to Pacific time.
