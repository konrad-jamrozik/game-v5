    So the tracks from

    S6 XCOM+NoDrones+AllowEpic+NoSynth+ModMil

    Ended up being too fast and little bit too generic military. I want to slow down a bit and refocus on the space / techno atmoshphere. Propose another yaml
  produced_prompt: |-
    Dark, atmospheric modern science-fiction tactical strategy game soundtrack, a contemporary reimagining of X-COM: UFO Defense, set in a high-tech orbital command center tracking alien craft in deep space. Cold, vast, and technological: glassy string harmonics, bowed metal, low cello and double bass sustains, muted brass swells, sonar-like pings, faint radio static, and precise ticking percussion like instruments on a console. Military snare only distant and sparse. Haunting minor-key melodies and unsettling dissonant string clusters.

    Create an atmosphere of paranoia, isolation, mystery, and constant extraterrestrial threat. Disciplined, cold, weightless, and deeply unsettling, with restrained melodic development and an unpredictable sense of danger. Slow tempo, around 65 BPM, sparse arrangement, wide reverberant space, deliberate silences.

    Emphasize psychological tension and the fear of the unknown rather than action or heroism.
prompt: |-
  Dark, atmospheric modern science-fiction tactical strategy game soundtrack; glassy string harmonics drift between sonar-like pings, with bowed metal, low cello and double bass sustains, muted brass swells, faint radio static, precise ticking percussion and distant, sparse military snare. Around 65 BPM, haunting minor-key melodies develop slowly beneath unsettling dissonant string clusters. A sparse, disciplined arrangement leaves deliberate silences in wide reverberant space; restrained melodic turns heighten paranoia, isolation and mystery. Instrumental.
