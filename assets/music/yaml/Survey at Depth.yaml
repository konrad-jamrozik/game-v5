elevenlabs:
  prompt: |-
    Dark, atmospheric 1990s science-fiction tactical strategy game soundtrack inspired by the musical atmosphere of the original X-COM: UFO Defense (1994) and X-COM: Terror from the Deep (1995), with subtle Lovecraftian cosmic horror influences.

    Authentic vintage PC game synthesizer aesthetic, combining eerie FM synthesis, haunting digital synthesizer melodies, unsettling harmonic progressions, strange alien electronic textures, ethereal pads, metallic resonances, and deep abyssal atmospheres.

    **Prioritize musical variety, evolving melodic ideas, expressive phrasing, and atmospheric development over repetitive rhythmic patterns.**

    Avoid continuous bass pulses, repetitive two-note ostinatos, monotonous four-on-the-floor rhythms, constant ticking percussion, and unchanging sequencer patterns. The music should not have a persistent "bum bum bum bum" rhythmic foundation.

    Instead, use atmospheric passages without percussion, short memorable minor-key melodic phrases, unexpected harmonic shifts, irregular electronic accents, mysterious counter-melodies, subtle changes in instrumentation, and occasional dramatic moments of dissonance.

    Introduce distinctive musical motifs that evolve and return in altered forms. Alternate between eerie stillness, mysterious exploration, quiet suspense, brief moments of alien terror, and haunting melancholy. Allow instruments to enter and disappear naturally. Use silence, contrast, and unusual textures to create anticipation.

    Subtle Lovecraftian influences: forgotten underwater civilizations, incomprehensible cosmic entities, distant sonar-like resonances, submerged ruins, and the oppressive darkness of the deep ocean. These elements should enrich the X-COM science-fiction atmosphere rather than overwhelm it.

    The music should feel like an actual composed soundtrack with interesting musical ideas, not merely a repeating ambient loop. Create a mysterious, memorable, unsettling retro sci-fi composition with varied phrases and clear musical development.

    Restrained 1990s DOS MIDI and Sound Blaster aesthetic, slightly lo-fi digital timbres, no modern Hollywood orchestration, no epic percussion, no vocals, no guitars.

    Instrumental, suitable for extended tactical gameplay. Atmospheric and varied without becoming distracting. Gentle transitions and an unresolved, haunting conclusion.
