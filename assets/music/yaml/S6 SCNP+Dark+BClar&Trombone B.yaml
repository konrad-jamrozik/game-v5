suno:
  prompt: |-
    Dark, brooding tactical strategy game soundtrack with deep bass drones, low-frequency rumbling, hollow bass clarinet, and ominous muted trombone. Sinister, mysterious, claustrophobic, and deeply unsettling.

    Minimalist arrangement dominated by thick, resonant low-end frequencies, shadowy minor-key harmonies, sparse percussion, and slow hypnotic bass pulses. Breathy, low-register bass clarinet phrases weave through the darkness, accompanied by distant muted trombone notes and restrained brass swells.

    Evoke paranoia, secrecy, isolation, and an unseen, approaching threat. Slowly evolving layers, subtle dissonance, eerie woodwind motifs, and haunting brass resonances. Organic, gritty, oppressive, and grounded rather than futuristic or cosmic.

    Very slow tempo, understated intensity, seamless loopable background music for prolonged strategy gameplay. No vocals, no bright synth leads, no spacey effects, no upbeat rhythms, no dramatic crescendos, no epic orchestration.
