  produced_prompt: |-
    Sci-fi tactical strategy game ambient soundtrack. Cold, mysterious retro-futuristic synths, atmospheric drones, subtle sequenced pulses, and faint electronic signals, layered with a small chamber ensemble: felt piano, violins, cello, bowed double bass, bass clarinet, muted trombone, bowed cymbals.

    Slow, minimal percussion, no driving beats. Hypnotic, cerebral, quietly suspenseful. Evoke military surveillance, alien signal analysis, an unseen threat.

    Double bass and trombone sit low under the drones; sparse piano and bass clarinet answer the pulses; cello and distant violins drift over the pads; bowed cymbals swell like metallic signals. Instruments enter and fade one at a time, never all at once. Subtle dissonance, plenty of negative space.

    Understated, seamlessly loopable background music. No vocals, no epic orchestration, no crescendos, no cheerful melodies, no EDM drops.
