  Ambient soundtrack, instrumental; understated, seamlessly loopable mix with wide negative space and subtle dissonance; cold retro-futuristic synths and drones, low bowed double bass and muted trombone, sparse felt piano and bass clarinet answering faint pulses, cello and distant violins drifting over pads, bowed cymbal swells and faint electronic signals; unhurried suspended half-time feel, minimal percussion, each instrument entering and fading in turn.
