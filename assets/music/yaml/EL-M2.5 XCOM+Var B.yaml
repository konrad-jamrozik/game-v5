elevenlabs:
  prompt: |-
    Dark, atmospheric 1990s science-fiction tactical strategy game soundtrack, inspired by the original X-COM: UFO Defense (1994). Authentic retro MIDI and Amiga-era synthesizer sound, eerie ambient electronic music, ominous low-frequency drones, haunting minor-key melodies, sparse metallic percussion, unsettling dissonant synth chords, strange alien electronic textures, and subtle pulsing bass sequences.

    Create an atmosphere of paranoia, isolation, mystery, and constant extraterrestrial threat. Minimalist, cold, hypnotic, and deeply unsettling, with restrained but evolving melodic development and an unpredictable sense of danger. Slow to moderate tempo, sparse arrangement, deliberate silences, and occasional eerie high-pitched electronic tones.

    Introduce subtle musical variety through changing melodic phrases, occasional unexpected harmonic shifts, evolving synth textures, and brief appearances of distinctive alien-sounding motifs. Allow different instruments and textures to emerge and recede naturally. Vary the rhythmic patterns occasionally, avoiding an unchanging repetitive bass pulse while preserving the hypnotic atmosphere. Alternate between sparse, quiet passages and slightly richer arrangements, without dramatic increases in tempo or intensity.

    Emphasize psychological tension and the fear of the unknown rather than action or heroism. Vintage 1990s PC game synthesizer aesthetic, slightly lo-fi digital instrumentation, no modern cinematic orchestration, no epic percussion, no guitars, no vocals.

    Instrumental background music designed for long strategic gameplay sessions. Subtle variation, consistent ominous atmosphere, memorable but understated melodic motifs, and seamless looping without a dramatic introduction or ending.
