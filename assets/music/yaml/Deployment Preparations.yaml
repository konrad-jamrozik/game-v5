elevenlabs:
  prompt: |-
    Dark, ominous, atmospheric 1990s science-fiction strategy game soundtrack, inspired by the original X-COM: UFO Defense (1994) Geoscape music.

    Cold, serious, threatening electronic music conveying the constant danger of an unknown extraterrestrial invasion. Humanity is desperately coordinating its defense against a technologically superior alien civilization. The atmosphere is one of uncertainty, paranoia, isolation, military vigilance, scientific mystery, and impending catastrophe.

    Authentic vintage 1990s DOS PC game synthesizer aesthetic, with dark FM synthesis, cold digital synthesizer textures, deep ominous drones, hollow electronic tones, metallic resonances, unsettling minor-key harmonies, and sparse, haunting melodies.

    SLOW BUT THREATENING. Restrained tempo around 55–65 BPM, with an unmistakable atmosphere of danger and unease. The music should feel tense and foreboding even during its quietest passages.

    Use mysterious, memorable synthesizer motifs built around minor seconds, tritones, descending chromatic intervals, and unresolved dissonant harmonies. Introduce unexpected harmonic changes, eerie counter-melodies, and occasional disturbing electronic textures to maintain interest.

    Employ slow, dark harmonic progressions, sustained dissonant chords, sparse low-register synth notes, distant metallic impacts, and irregular electronic accents. Allow moments of near-silence to emphasize isolation and suspense.

    Avoid persistent rhythmic bass pulses, repetitive ostinatos, continuous ticking percussion, or mechanically repeating patterns. Rhythmic elements should appear occasionally to reinforce tension, then disappear.

    The music should evolve gradually through distinct but coherent passages, alternating between oppressive stillness, sinister melodic development, unsettling harmonic changes, and brief increases in psychological tension.

    Maintain a sense of military seriousness, alien menace, cold technological environments, and existential danger throughout. No warmth, comfort, sentimentality, optimism, or relaxation.

    Avoid cozy lo-fi music, chillhop, jazzy chords, pleasant ambient soundscapes, soft piano, warm synth pads, soothing melodies, upbeat rhythms, cinematic action music, epic orchestration, and dramatic combat percussion.

    Instrumental only. Cold, dark, slightly lo-fi 1990s electronic synthesis with restrained dynamics, deliberate pacing, haunting melodic identity, and an unresolved atmosphere of ever-present extraterrestrial threat.

    Designed for extended strategic gameplay on a global defense command screen, where every passing hour brings humanity closer to an unknown catastrophe.
