final_prompt_from_gen_tool: |-
  Electronic strategy-game soundtrack, instrumental; short, irregular sequencer phrases move rounded FM tones through an original X-COM Geoscape-inspired motif, with a faint synth bed fading between phrases. Close-miked felt piano answers in lower-register two- or three-note fragments; lightly tapped cymbal leaves immediate metallic ticks. Distant sonar pings and detuned signal fragments fill the gaps. Clean and spacious mix, silence between sounds, seamless loop and restrained dynamics; around 82 BPM, with quiet momentum and cold, ominous suspense, quietly menacing.
notes: |-
  A crop, made in Suno's editor, of the first song of the generation that also made Deep Space Contact A; Suno's clip data marks it `metadata.type` `edit_crop` and hides the song it was cropped from. The crop keeps only the Styles text, so `suno` is the generation's, as for Deep Space Contact A: the Exclude styles, Instrumental switch, and sliders the Game designer set, which the crop's clip data does not hold. Suno's Audio influence slider was at 25%, but no reference audio was loaded, so it had no effect and the record leaves it out. `final_prompt_from_gen_tool` is the Styles text Suno stored, which Suno's Variety at Normal rewrote from `suno.prompt`, differently from Deep Space Contact A. `created` is the crop's UTC creation time converted to Pacific time, and `length` is the crop's; Suno's clip data holds no display tags for the crop, so `tags` is empty.
