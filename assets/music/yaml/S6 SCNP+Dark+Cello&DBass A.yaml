prompt: |-
  Dark, brooding tactical strategy game soundtrack with mournful cello and deep bowed double bass. Oppressive, melancholic, claustrophobic, and quietly threatening.

    Minimalist arrangement: resonant contrabass drones and low string vibrations beneath sparse, restrained cello phrases. Shadowy minor-key harmonies, subtle dissonance, long sustained notes, and ample silence. Let the double bass provide subterranean weight while the cello adds subdued emotional unease.

    Evoke paranoia, isolation, secrecy, and an unseen approaching threat. Organic, woody, gritty, and grounded. Slowly evolving textures, very slow pacing, understated intensity, and unobtrusive background music suitable for prolonged strategy gameplay.

    No prominent rhythmic ostinato, driving beat, dramatic builds, climaxes, or abrupt ending. Keep the texture and dynamics consistent for looping.
