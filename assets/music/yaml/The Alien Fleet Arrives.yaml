notes: |-
  `suno.prompt` is the prompt of Descent to Earth without what its Slow adjustment added, i.e. the slow-tempo paragraph and "Serious and threatening, never cheerful, uplifting, or comforting.", and without the sentence "Authentic retro MIDI and Amiga-era synthesizer sound."; the rest is word for word. `final_prompt_from_gen_tool` is the Styles text Suno stored, not the one pasted in: Suno's Variety at High (`suno.variety: 2`, stored by Suno as `aug_creativity: 2`) rewrote it, differently for each variation. The Game designer edited Claude Code's draft before generating: from the draft's Weirdness 40% to 50% and Variety Off to High, and taking synthwave, epic orchestral, aggressive drums, and heroic brass out of the Exclude styles of S6 SCNP+7Instr plus chiptune and 8-bit, which the AllowHeroAggr adjustment names; the Game designer also dropped the Bare adjustment from the track's name. Suno's clip data holds no Weirdness value, as it omits the default of 50%; `suno.weirdness` is the value the Game designer set. `created`, `length`, `model`, `tags`, Style influence, and Variety come from Suno's clip data for the song; `created` is its UTC creation time converted to Pacific time.
