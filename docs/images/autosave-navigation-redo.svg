<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Autosave navigation going forward: four redoToAutosave() calls from the Turn-end Autosave of Turn 3 load the Turn-end Autosave of Turn 4, the Engagement Autosave, the Turn-end Autosave of Turn 9, and the Return Autosave in Turn 10">
