<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="584" viewBox="0 0 1000 584" role="img" aria-label="Specification layers from top to bottom. Game concepts and mechanics: Agent Recovery, Agents, Combat, Economy and Upgrades, Factions, Investigations, Leads and Progression, Missions, Panic and Endings. The engine: Autopilot, Campaign Lifecycle, Campaign State, Configuration, Determinism and Randomness, Developer Access, Domain Model, Engine Contract, Game Data Records, Numbers, Saves, Timeline, Turn Advancement. Core Concepts: Core Concepts.">
  <title>Specification layers from top to bottom. Game concepts and mechanics: Agent Recovery, Agents, Combat, Economy and Upgrades, Factions, Investigations, Leads and Progression, Missions, Panic and Endings. The engine: Autopilot, Campaign Lifecycle, Campaign State, Configuration, Determinism and Randomness, Developer Access, Domain Model, Engine Contract, Game Data Records, Numbers, Saves, Timeline, Turn Advancement. Core Concepts: Core Concepts.</title>
  <style>
    :root { --bg: #ffffff; --muted: #5b6676;
      --tip-bg: #fbe9d9; --tip-fg: #8a4a12; --mech-bg: #e3f2ea; --mech-fg: #1d6b4c;
      --found-bg: #dfe8fb; --found-fg: #23428f; --bottom-bg: #e9edf5; --bottom-fg: #3b4458; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12161d; --muted: #9aa5b5;
        --tip-bg: #3a2a1a; --tip-fg: #f2b780; --mech-bg: #17302a; --mech-fg: #7fd8b1;
        --found-bg: #1c2742; --found-fg: #a9c0ff; --bottom-bg: #232a36; --bottom-fg: #c3cad6; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; text-anchor: middle; }
    .bg { fill: var(--bg); }
    .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.1em; }
    .name { font-size: 19px; font-weight: 600; }
    .note { font-size: 13.5px; }
    .chip-text { font-size: 13.5px; }
    .chip { fill: none; stroke-width: 1.2; }
    .connector, .caption { fill: var(--muted); font-size: 12.5px; }
    .band-tip { fill: var(--tip-bg); } .ink-tip { fill: var(--tip-fg); } .stroke-tip { stroke: var(--tip-fg); }
    .band-mech { fill: var(--mech-bg); } .ink-mech { fill: var(--mech-fg); } .stroke-mech { stroke: var(--mech-fg); }
    .band-found { fill: var(--found-bg); } .ink-found { fill: var(--found-fg); } .stroke-found { stroke: var(--found-fg); }
    .band-bottom { fill: var(--bottom-bg); } .ink-bottom { fill: var(--bottom-fg); } .stroke-bottom { stroke: var(--bottom-fg); }
  </style>
