<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-label="Specification layers from top to bottom. Mechanics, from its top layer to its bottom layer: Investigations, Missions, Turn Advancement; Agent Recovery, Combat, Economy and Upgrades, Factions, Leads and Progression; Agents, Panic and Endings; Domain Model. Foundation, from its top layer to its bottom layer: Autopilot, Configuration, Developer Access; Timeline, World History; Campaign Instances, Numbers, Saves; Determinism and Randomness, Game Data Records; Campaign Lifecycle, Campaign State, Player API; Engine Contract; Core Concepts.">
