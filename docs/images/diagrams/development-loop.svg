<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="The Development loop: the Game designer says what should change; the apply skill changes the specifications in the Spec repo when a design decision changes, and then the code and tests in the Implementation repo; the Game designer plays the Implementation, which forms the next Designer feedback">
  <!-- Hand-kept diagram for docs/specs/governance/process/development-loop.md; not generated. -->
  <style>
    :root { --bg: #ffffff; --surface: #ffffff; --block: #f1f4f7; --fg: #1b2330; --muted: #5b6676; --line: #d5dae2; --accent: #2f7f95; --accenttint: #e6f2f5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12161d; --surface: #1a2029; --block: #232a35; --fg: #e6eaf0; --muted: #9aa5b5; --line: #3a4453; --accent: #6fb3c7; --accenttint: #18303a; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .title { font-size: 15px; font-weight: 600; }
    .lane { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; fill: var(--muted); }
    .b { font-weight: 600; }
    .m { fill: var(--muted); font-size: 11.5px; }
    .mid { text-anchor: middle; }
    .code { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 11.5px; fill: var(--accent); }
    .repo { fill: var(--surface); stroke: var(--accent); stroke-width: 1.8; }
    .actor { fill: var(--accenttint); stroke: var(--accent); stroke-width: 1.8; }
    .inner { fill: var(--block); stroke: var(--line); stroke-width: 1.2; }
    .arrow { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" style="fill: var(--muted)"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="500"/>
  <text class="title" x="24" y="30">The Development loop</text>

  <!-- Game designer -->
  <rect class="actor" x="420" y="52" width="160" height="54" rx="8"/>
  <text class="b mid" x="500" y="75">Game designer</text>
  <text class="m mid" x="500" y="93">keeps every design decision</text>

  <!-- 1: Game designer says what should change -->
  <path class="arrow" d="M420 79 L215 79 L215 166"/>
  <text class="b" x="226" y="70">① Say what should change</text>
  <text x="226" y="98"><tspan class="m">carried out by </tspan><tspan class="code">apply</tspan></text>

  <!-- 4: Implementation to Game designer -->
  <path class="arrow" d="M785 168 L785 79 L582 79"/>
  <text class="b" x="618" y="70">④ Play and review</text>
  <text class="m" x="618" y="98">forms Designer feedback</text>

  <!-- Spec repo -->
  <rect class="repo" x="30" y="170" width="370" height="255" rx="10"/>
  <text class="lane" x="48" y="192">SPEC REPO · THE DECISIONS</text>

  <rect class="inner" x="48" y="205" width="334" height="80" rx="6"/>
  <text class="b" x="62" y="229">Design specifications</text>
  <text class="m" x="62" y="248">Foundation, Mechanics, Content, UI, Autopilot AIs</text>
  <text class="m" x="62" y="264">decisions, terms, concepts, and diagrams,</text>
  <text class="m" x="62" y="279">each stated once</text>

  <rect class="inner" x="48" y="298" width="334" height="50" rx="6"/>
  <text class="b" x="62" y="320">Game data and assets</text>
  <text class="m" x="62" y="338">content/ holds every value; assets/ the music, sounds, art</text>

  <rect class="inner" x="48" y="361" width="334" height="50" rx="6"/>
  <text class="b" x="62" y="383">Governance and Implementation specifications</text>
  <text class="m" x="62" y="401">how specifications are written; how the code is kept</text>

  <!-- Implementation repo -->
  <rect class="repo" x="600" y="170" width="370" height="255" rx="10"/>
  <text class="lane" x="618" y="192">IMPLEMENTATION REPO · THE GAME</text>

  <rect class="inner" x="618" y="205" width="334" height="80" rx="6"/>
  <text class="b" x="632" y="229">Code and tests</text>
  <text class="m" x="632" y="248">follow every decision the specifications state,</text>
  <text class="m" x="632" y="264">and decide whatever they do not state</text>

  <rect class="inner" x="618" y="298" width="334" height="50" rx="6"/>
  <text class="b" x="632" y="320">Copies of game data and assets</text>
  <text class="m" x="632" y="338">mirrored from the Spec repo, never edited by hand</text>

  <rect class="inner" x="618" y="361" width="334" height="50" rx="6"/>
  <text class="b" x="632" y="383">Commits</text>
  <text class="m" x="632" y="401">each names the Spec repo commit it follows</text>

  <!-- 2: change the specifications -->
  <text class="b mid" x="500" y="222">② Change the specifications</text>
  <text class="m mid" x="500" y="239">only when a decision changes;</text>
  <text class="m mid" x="500" y="254">checked by spec-review</text>

  <!-- 3: change the Implementation -->
  <path class="arrow" d="M402 322 L598 322"/>
  <text class="b mid" x="500" y="308">③ Change the Implementation</text>
  <text class="m mid" x="500" y="342">always</text>

  <!-- footer -->
  <text class="m" x="30" y="456">A decision is stated in the specifications first and the code follows it. What no specification states is decided by the code</text>
  <text class="m" x="30" y="474">and changed there alone, so the specifications grow by decisions and never by gaps.</text>
</svg>
