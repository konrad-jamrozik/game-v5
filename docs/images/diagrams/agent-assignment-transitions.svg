<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800" role="img" aria-label="Agent Assignment transitions: Standby and Training, the Base Assignments, switch to each other at once and are the only Assignments an Agent can be deployed from; only an Agent on one can be ordered to Contracting or an Investigation, the Away Assignments, and an Agent on an Away Assignment can only be recalled to Standby; every move to or from an Away Assignment passes through In transit for one Advance turn, and an Agent In transit cannot be assigned; Deployed and Recovering are left only by an Advance turn; Killed and Dismissed are final">
  <!-- Hand-kept diagram for docs/specs/design/mechanics/agents-spec.md, Assignment changes; not generated. -->
  <style>
    :root { --bg: #ffffff; --block: #f1f4f7; --band: #f6f8fa; --fg: #1b2330; --muted: #5b6676; --line: #d5dae2; --now: #1f7a52; --lock: #fbf0dc; --lockline: #a8690a; --term: #eceef2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12161d; --block: #1a2029; --band: #161b23; --fg: #e6eaf0; --muted: #9aa5b5; --line: #323b49; --now: #6fd3a4; --lock: #33290f; --lockline: #e0a64a; --term: #232832; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .title { font-size: 15px; font-weight: 600; }
    .grp { fill: var(--block); stroke: var(--line); }
    .band { fill: var(--band); stroke: var(--line); stroke-dasharray: 4 4; }
    .gl { font-size: 11px; font-weight: 600; letter-spacing: 1px; fill: var(--muted); }
    .n { fill: var(--bg); stroke: var(--fg); stroke-width: 1.3; }
    .transit { stroke-dasharray: 5 4; }
    .lock { fill: var(--lock); stroke: var(--lockline); }
    .term { fill: var(--term); stroke: var(--muted); }
    .t1 { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .t2 { font-size: 12px; fill: var(--muted); text-anchor: middle; }
    .play { fill: none; stroke: var(--fg); stroke-width: 1.4; }
    .turn { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 6 4; }
    .now { fill: none; stroke: var(--now); stroke-width: 2.6; }
    .el { font-size: 11.5px; fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
    .eln { fill: var(--now); font-weight: 600; }
    .start { fill: var(--fg); }
    .hp { fill: var(--fg); } .hm { fill: var(--muted); } .hn { fill: var(--now); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="hp" d="M0 1 L10 5 L0 9z"/></marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="hm" d="M0 1 L10 5 L0 9z"/></marker>
    <marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path class="hn" d="M0 1 L10 5 L0 9z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1300" height="800"/>
  <text class="title" x="24" y="30">Agent Assignment transitions: each box is one pair of Assignment and Agent status</text>

  <g transform="translate(60,50)">
    <!-- group areas -->
    <rect class="grp" x="40" y="140" width="260" height="170" rx="10"/>
    <text class="gl" x="44" y="132">IN BASE · BASE ASSIGNMENTS</text>
    <rect class="band" x="490" y="150" width="270" height="450" rx="10"/>
    <text class="gl" x="500" y="590">IN TRANSIT · ONE ADVANCE TURN</text>
    <rect class="grp" x="920" y="340" width="260" height="180" rx="10"/>
    <text class="gl" x="924" y="332">AWAY · AWAY ASSIGNMENTS</text>

    <!-- Advance turn -->
    <path class="turn" d="M520,192 H272" marker-end="url(#ahm)"/>
    <text class="el" x="395" y="185">arrives</text>
    <path class="turn" d="M720,392 H948" marker-end="url(#ahm)"/>
    <text class="el" x="835" y="385">arrives</text>
    <path class="turn" d="M720,472 H948" marker-end="url(#ahm)"/>
    <text class="el" x="835" y="465">arrives</text>
    <path class="turn" d="M320,62 H252" marker-end="url(#ahm)"/>
    <text class="el" x="286" y="28">arrives</text>
    <path class="turn" d="M520,62 H482" marker-end="url(#ahm)"/>
    <text class="el" x="501" y="28">survives, hurt</text>
    <path class="turn" d="M720,62 H948" marker-end="url(#ahm)"/>
    <text class="el" x="835" y="55">dies in Combat</text>
    <path class="turn" d="M620,84 V168" marker-end="url(#ahm)"/>
    <text class="el" x="628" y="140" text-anchor="start">survives, full health</text>
    <path class="turn" d="M160,84 V168" marker-end="url(#ahm)"/>
    <text class="el" x="168" y="122" text-anchor="start">healed</text>
    <path class="turn" d="M1150,482 H1200 V180 H722" marker-end="url(#ahm)"/>
    <text class="el" x="960" y="173">Investigation completes</text>

    <!-- Player actions that start In transit -->
    <path class="play" d="M300,300 H420 V432 H500"/>
    <path class="play" d="M500,392 V472"/>
    <path class="play" d="M500,392 H518" marker-end="url(#ah)"/>
    <path class="play" d="M500,472 H518" marker-end="url(#ah)"/>
    <text class="el" x="360" y="293">order</text>
    <path class="play" d="M1000,340 V204 H722" marker-end="url(#ah)"/>
    <text class="el" x="860" y="224">recall: assignAgents to Standby</text>
    <path class="play" d="M70,206 H55 V642 H68" marker-end="url(#ah)"/>
    <text class="el" x="80" y="611" text-anchor="start">dismissAgents</text>

    <!-- Player actions with no transit -->
    <path class="now" d="M130,214 V248" marker-end="url(#ahn)"/>
    <path class="now" d="M210,250 V216" marker-end="url(#ahn)"/>
    <text class="el eln" x="170" y="236">assignAgents</text>
    <path class="now" d="M260,140 V112 H570 V86" marker-end="url(#ahn)"/>
    <text class="el eln" x="410" y="105">deployAgents, only from base</text>

    <!-- creation -->
    <circle class="start" cx="-30" cy="180" r="5"/>
    <path class="play" d="M-25,180 H68" marker-end="url(#ah)"/>
    <text class="el" x="-30" y="155">initial</text>
    <text class="el" x="-30" y="168">roster</text>
    <circle class="start" cx="540" cy="140" r="5"/>
    <path class="play" d="M540,145 V168" marker-end="url(#ah)"/>
    <text class="el" x="532" y="144" text-anchor="end">hire, addAgents</text>

    <!-- nodes -->
    <text class="el" x="625" y="518">An Agent In transit cannot be assigned</text>
    <rect class="n" x="70" y="170" width="200" height="44" rx="6"/><text class="t1" x="170" y="189">Standby</text><text class="t2" x="170" y="205">At assignment</text>
    <rect class="n" x="70" y="250" width="200" height="44" rx="6"/><text class="t1" x="170" y="269">Training</text><text class="t2" x="170" y="285">At assignment</text>
    <rect class="n transit" x="520" y="170" width="200" height="44" rx="6"/><text class="t1" x="620" y="189">Standby</text><text class="t2" x="620" y="205">In transit</text>
    <rect class="n transit" x="520" y="370" width="200" height="44" rx="6"/><text class="t1" x="620" y="389">Contracting</text><text class="t2" x="620" y="405">In transit</text>
    <rect class="n transit" x="520" y="450" width="200" height="44" rx="6"/><text class="t1" x="620" y="469">Investigation</text><text class="t2" x="620" y="485">In transit</text>
    <rect class="n" x="950" y="370" width="200" height="44" rx="6"/><text class="t1" x="1050" y="389">Contracting</text><text class="t2" x="1050" y="405">At assignment</text>
    <rect class="n" x="950" y="450" width="200" height="44" rx="6"/><text class="t1" x="1050" y="469">Investigation</text><text class="t2" x="1050" y="485">At assignment</text>
    <rect class="n lock" x="70" y="40" width="180" height="44" rx="6"/><text class="t1" x="160" y="59">Recovery</text><text class="t2" x="160" y="75">Recovering</text>
    <rect class="n transit" x="320" y="40" width="160" height="44" rx="6"/><text class="t1" x="400" y="59">Recovery</text><text class="t2" x="400" y="75">In transit</text>
    <rect class="n lock" x="520" y="40" width="200" height="44" rx="6"/><text class="t1" x="620" y="59">Deployed</text><text class="t2" x="620" y="75">At assignment</text>
    <rect class="n term" x="950" y="40" width="200" height="44" rx="6"/><text class="t1" x="1050" y="59">Killed</text><text class="t2" x="1050" y="75">Terminated</text>
    <rect class="n term" x="70" y="620" width="200" height="44" rx="6"/><text class="t1" x="170" y="639">Dismissed</text><text class="t2" x="170" y="655">Terminated</text>
  </g>

  <!-- legend -->
  <g transform="translate(84,764)">
    <path class="now" d="M0,0 H34" marker-end="url(#ahn)"/><text x="44" y="4">Player action, no transit</text>
    <path class="play" d="M210,0 H244" marker-end="url(#ah)"/><text x="254" y="4">Player action; “order” is assignAgents or an Investigation action, only from base</text>
    <path class="turn" d="M740,0 H774" marker-end="url(#ahm)"/><text x="784" y="4">Advance turn</text>
    <rect class="n transit" x="890" y="-8" width="24" height="16" rx="3"/><text x="922" y="4">In transit</text>
    <rect class="n lock" x="992" y="-8" width="24" height="16" rx="3"/><text x="1024" y="4">locked</text>
    <rect class="n term" x="1080" y="-8" width="24" height="16" rx="3"/><text x="1112" y="4">Terminated</text>
  </g>
</svg>
