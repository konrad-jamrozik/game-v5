<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="832" viewBox="0 0 1000 832" role="img" aria-label="Family architecture. Content builds on Foundation and Mechanics and UI. UI builds on Foundation and Mechanics. Autopilot AIs builds on Foundation and Mechanics and UI. Mandatory builds on Foundation and Mechanics and UI and Autopilot AIs. Guidance builds on Foundation and Mechanics and Autopilot AIs and Mandatory. Recipes builds on Foundation and UI and Mandatory. Autopilot Studies builds on Foundation and Mechanics and Autopilot AIs. Foundation and Mechanics form the game engine.">
  <title>Family architecture. Content builds on Foundation and Mechanics and UI. UI builds on Foundation and Mechanics. Autopilot AIs builds on Foundation and Mechanics and UI. Mandatory builds on Foundation and Mechanics and UI and Autopilot AIs. Guidance builds on Foundation and Mechanics and Autopilot AIs and Mandatory. Recipes builds on Foundation and UI and Mandatory. Autopilot Studies builds on Foundation and Mechanics and Autopilot AIs. Foundation and Mechanics form the game engine.</title>
  <style>
    :root { --bg: #ffffff; --fg: #1b2330; --muted: #5b6676; --line: #8a94a6; --box: #f6f7f9;
      --engine-bg: #f1f2f5; --found-bg: #dfe5f7; --found-fg: #2d3f8f; --mech-bg: #f7dceb; --mech-fg: #8c2a5d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12161d; --fg: #e6eaf0; --muted: #9aa5b5; --line: #7c8698; --box: #1a2029;
        --engine-bg: #1b2029; --found-bg: #222b4a; --found-fg: #b3c2ff; --mech-bg: #43233b; --mech-fg: #f5afd3; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; text-anchor: middle; }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .engine { fill: var(--engine-bg); stroke: var(--line); stroke-width: 1.3; }
    .title { fill: var(--fg); font-size: 17px; font-weight: 600; }
    .count { fill: var(--muted); font-size: 12.5px; }
    .engine-title { fill: var(--fg); font-size: 18px; font-weight: 600; }
    .band-found { fill: var(--found-bg); } .ink-found { fill: var(--found-fg); }
    .band-mech { fill: var(--mech-bg); } .ink-mech { fill: var(--mech-fg); }
    .band-name { font-size: 15px; font-weight: 600; }
    .band-count { font-size: 12.5px; }
    .arrow { stroke: var(--line); stroke-width: 1.6; fill: none; }
    .head { fill: var(--line); }
    .caption { fill: var(--muted); font-size: 12.5px; }
  </style>
