<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="696" viewBox="0 0 1000 696" role="img" aria-label="Family architecture. Content builds on Foundation and Mechanics and UI. UI builds on Foundation and Mechanics. Autopilot AIs builds on Foundation and Mechanics. Mandatory builds on Foundation and UI. Guidance builds on Foundation. Recipes builds on Foundation and UI and Mandatory. Foundation and Mechanics form the game engine.">
  <title>Family architecture. Content builds on Foundation and Mechanics and UI. UI builds on Foundation and Mechanics. Autopilot AIs builds on Foundation and Mechanics. Mandatory builds on Foundation and UI. Guidance builds on Foundation. Recipes builds on Foundation and UI and Mandatory. Foundation and Mechanics form the game engine.</title>
  <style>
    :root { --bg: #ffffff; --fg: #1b2330; --muted: #5b6676; --line: #8a94a6; --box: #f6f7f9;
      --engine-bg: #f1f2f5; --found-bg: #dfe5f7; --found-fg: #2d3f8f; --mech-bg: #f7dceb; --mech-fg: #8c2a5d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12161d; --fg: #e6eaf0; --muted: #9aa5b5; --line: #7c8698; --box: #1a2029;
        --engine-bg: #1b2029; --found-bg: #222b4a; --found-fg: #b3c2ff; --mech-bg: #43233b; --mech-fg: #f5afd3; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; text-anchor: middle; }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .engine { fill: var(--engine-bg); stroke: var(--line); stroke-width: 1.3; }
    .title { fill: var(--fg); font-size: 17px; font-weight: 600; }
    .count { fill: var(--muted); font-size: 12.5px; }
    .engine-title { fill: var(--fg); font-size: 18px; font-weight: 600; }
    .band-found { fill: var(--found-bg); } .ink-found { fill: var(--found-fg); }
    .band-mech { fill: var(--mech-bg); } .ink-mech { fill: var(--mech-fg); }
    .band-name { font-size: 15px; font-weight: 600; }
    .band-count { font-size: 12.5px; }
    .arrow { stroke: var(--line); stroke-width: 1.6; fill: none; }
    .head { fill: var(--line); }
    .caption { fill: var(--muted); font-size: 12.5px; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="696"/>
  <rect class="box" x="385" y="28" width="230" height="66" rx="10"/>
  <text class="title" x="500" y="56">Recipes</text>
  <text class="count" x="500" y="77">3 specifications</text>
  <rect class="box" x="246" y="164" width="230" height="66" rx="10"/>
  <text class="title" x="361" y="192">Content</text>
  <text class="count" x="361" y="213">1 specification</text>
  <rect class="box" x="524" y="164" width="230" height="66" rx="10"/>
  <text class="title" x="639" y="192">Mandatory</text>
  <text class="count" x="639" y="213">4 specifications</text>
  <rect class="box" x="107" y="300" width="230" height="66" rx="10"/>
  <text class="title" x="222" y="328">UI</text>
  <text class="count" x="222" y="349">17 specifications</text>
  <rect class="box" x="385" y="300" width="230" height="66" rx="10"/>
  <text class="title" x="500" y="328">Autopilot AIs</text>
  <text class="count" x="500" y="349">1 specification</text>
  <rect class="box" x="663" y="300" width="230" height="66" rx="10"/>
  <text class="title" x="778" y="328">Guidance</text>
  <text class="count" x="778" y="349">4 specifications</text>
  <rect class="engine" x="180" y="436" width="640" height="166" rx="12"/>
  <text class="engine-title" x="500" y="463">Game engine</text>
  <rect class="band-mech" x="234" y="476" width="532" height="52" rx="8"/>
  <text class="band-name ink-mech" x="500" y="498">Mechanics</text>
  <text class="band-count ink-mech" x="500" y="516">12 specifications</text>
  <rect class="band-found" x="194" y="536" width="612" height="52" rx="8"/>
  <text class="band-name ink-found" x="500" y="558">Foundation</text>
  <text class="band-count ink-found" x="500" y="576">16 specifications</text>
