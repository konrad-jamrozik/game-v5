  <path class="head" d="M 403 290 L 415 290 L 409 300 Z"/>
  <path class="arrow" d="M 421 230 L 421 292"/>
  <path class="head" d="M 415 290 L 427 290 L 421 300 Z"/>
  <path class="arrow" d="M 699 230 L 699 292"/>
  <path class="head" d="M 693 290 L 705 290 L 699 300 Z"/>
  <path class="arrow" d="M 977 230 L 977 292"/>
  <path class="head" d="M 971 290 L 983 290 L 977 300 Z"/>
  <path class="arrow" d="M 1255 230 L 989 292"/>
  <path class="head" d="M 983 290 L 995 290 L 989 300 Z"/>
  <path class="arrow" d="M 699 94 L 699 292"/>
  <path class="head" d="M 693 290 L 705 290 L 699 300 Z"/>
  <path class="arrow" d="M 699 94 L 506 156"/>
  <path class="head" d="M 500 154 L 512 154 L 506 164 Z"/>
  <path class="arrow" d="M 699 94 L 892 156"/>
