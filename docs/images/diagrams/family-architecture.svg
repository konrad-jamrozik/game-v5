  <path class="arrow" d="M 639 230 L 307 292"/>
  <path class="head" d="M 301 290 L 313 290 L 307 300 Z"/>
  <path class="arrow" d="M 778 366 L 778 428"/>
  <path class="head" d="M 772 426 L 784 426 L 778 436 Z"/>
  <path class="arrow" d="M 500 94 L 500 428"/>
  <path class="head" d="M 494 426 L 506 426 L 500 436 Z"/>
