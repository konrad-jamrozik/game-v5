    <marker id="headauto" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="headauto" d="M0 1 L10 5 L0 9z"/></marker>
  </defs>
