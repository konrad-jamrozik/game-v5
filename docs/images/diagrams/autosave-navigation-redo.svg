<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img" aria-label="Autosave navigation going forward: five redoToAutosave() calls from the Turn-end Autosave of Turn 4 load the Engagement Autosave, the Autopilot Autosave of Turn 8, the Disengagement Autosave, the Turn-end Autosave of Turn 9, and the Furthest progress Autosave in Turn 10">
  <!-- Hand-kept diagram for docs/specs/design/foundation/timeline.md; not generated. -->
  <style>
    :root { --bg: #ffffff; --surface: #ffffff; --block: #f1f4f7; --fg: #1b2330; --muted: #5b6676; --line: #d5dae2; --turn: #2f7f95; --auto: #b26a00; --tint: #fbefd9; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12161d; --surface: #1a2029; --block: #1a2029; --fg: #e6eaf0; --muted: #9aa5b5; --line: #323b49; --turn: #6fb3c7; --auto: #e0a64a; --tint: #3a2c14; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .title { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .m { fill: var(--muted); }
    .mid { text-anchor: middle; }
    .endt { text-anchor: end; }
    .ta { fill: var(--auto); font-weight: 600; }
    .axis { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .block { fill: var(--block); stroke: var(--line); stroke-width: 1.5; }
    .autoblock { fill: var(--tint); stroke: var(--auto); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .entry { fill: var(--surface); stroke: var(--fg); stroke-width: 2; }
    .ring { fill: none; stroke: var(--turn); stroke-width: 1.5; }
    .end { fill: var(--turn); stroke: var(--turn); stroke-width: 2; }
    .apa { fill: var(--auto); stroke: var(--auto); stroke-width: 2; }
    .eng { fill: var(--auto); stroke: var(--auto); stroke-width: 2; }
    .dis { fill: var(--surface); stroke: var(--auto); stroke-width: 2; }
    .ret { fill: var(--surface); stroke: var(--turn); stroke-width: 2; }
    .arc { fill: none; stroke: var(--turn); stroke-width: 1.8; }
    .arcauto { fill: none; stroke: var(--auto); stroke-width: 1.8; }
    .head { fill: var(--turn); }
    .headauto { fill: var(--auto); }
    .badge { fill: var(--surface); stroke: var(--turn); stroke-width: 1.5; }
    .badgeauto { fill: var(--surface); stroke: var(--auto); stroke-width: 1.5; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs>
