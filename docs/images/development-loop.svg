<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="The Development loop: the Game designer changes the specifications in the durable specification repository; the Implementer builds the Implementation with build-implementation, or updates it with update-implementation, in its disposable directory; Implementer feedback flows back into the specifications with absorb-implementation-records, repeating until no feedback is open; the Game designer plays and reviews the Implementation and turns Designer feedback into specification changes with apply-designer-feedback">
  <!-- Hand-kept diagram for docs/specs/governance/development-loop.md; not generated. -->
  <style>
    :root { --bg: #ffffff; --surface: #ffffff; --block: #f1f4f7; --fg: #1b2330; --muted: #5b6676; --line: #d5dae2; --accent: #2f7f95; --accenttint: #e6f2f5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12161d; --surface: #1a2029; --block: #232a35; --fg: #e6eaf0; --muted: #9aa5b5; --line: #3a4453; --accent: #6fb3c7; --accenttint: #18303a; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .title { font-size: 15px; font-weight: 600; }
    .lane { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; fill: var(--muted); }
    .b { font-weight: 600; }
    .m { fill: var(--muted); font-size: 11.5px; }
    .mid { text-anchor: middle; }
    .code { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 11.5px; fill: var(--accent); }
    .durable { fill: var(--surface); stroke: var(--accent); stroke-width: 1.8; }
    .disposable { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .actor { fill: var(--accenttint); stroke: var(--accent); stroke-width: 1.8; }
    .inner { fill: var(--block); stroke: var(--line); stroke-width: 1.2; }
    .arrow { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#head); }
    .cycle { stroke: var(--accent); stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-end: url(#headaccent); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" style="fill: var(--muted)"/>
    </marker>
    <marker id="headaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" style="fill: var(--accent)"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="560"/>
  <text class="title" x="24" y="30">The Development loop</text>

  <!-- Game designer -->
  <rect class="actor" x="420" y="52" width="160" height="54" rx="8"/>
  <text class="b mid" x="500" y="75">Game designer</text>
  <text class="m mid" x="500" y="93">keeps every design decision</text>

  <!-- 1 / 5: Game designer to specifications -->
  <path class="arrow" d="M420 79 L215 79 L215 166"/>
  <text class="b" x="226" y="70">① Change the specifications</text>
  <text x="226" y="98"><tspan class="b">⑤ </tspan><tspan class="code">apply-designer-feedback</tspan></text>
  <text class="m" x="226" y="114">checked by spec-review</text>

  <!-- 4: Implementation to Game designer -->
  <path class="arrow" d="M785 168 L785 79 L582 79"/>
  <text class="b" x="618" y="70">④ Play and review</text>
  <text class="m" x="618" y="98">forms Designer feedback</text>

  <!-- Specification repository -->
  <rect class="durable" x="30" y="170" width="370" height="295" rx="10"/>
  <text class="lane" x="48" y="192">SPECIFICATION REPOSITORY · DURABLE</text>

  <rect class="inner" x="48" y="205" width="334" height="65" rx="6"/>
  <text class="b" x="62" y="229">Governance specifications</text>
  <text class="m" x="62" y="248">Specification Conventions, Development Loop</text>
  <text class="m" x="62" y="263">how specifications are written; how the loop runs</text>

  <rect class="inner" x="48" y="285" width="334" height="65" rx="6"/>
  <text class="b" x="62" y="309">Design specifications</text>
  <text class="m" x="62" y="328">Foundation, Mechanics, Content, UI, Autopilot AIs</text>
  <text class="m" x="62" y="343">the game itself</text>

  <rect class="inner" x="48" y="365" width="334" height="80" rx="6"/>
  <text class="b" x="62" y="389">Implementation family specifications</text>
  <text class="m" x="62" y="408">Mandatory: placement, records, tracking</text>
  <text class="m" x="62" y="424">Guidance: technical suggestions and recipes</text>
  <text class="m" x="62" y="439">Skills sit beside them in .agents/skills/</text>

  <!-- Implementation directory -->
  <rect class="disposable" x="600" y="170" width="370" height="295" rx="10"/>
  <text class="lane" x="618" y="192">IMPLEMENTATION DIRECTORY · DISPOSABLE</text>

  <rect class="inner" x="618" y="205" width="334" height="65" rx="6"/>
  <text class="b" x="632" y="229">Implementation</text>
  <text class="m" x="632" y="248">code and tests</text>
  <text class="m" x="632" y="263">changed only as derived from the specifications</text>

  <rect class="inner" x="618" y="285" width="334" height="65" rx="6"/>
  <text class="b" x="632" y="309">Tracking records</text>
  <text class="m" x="632" y="328">Specification baseline: which commit it follows</text>
  <text class="m" x="632" y="343">Specification map: which files implement which spec</text>

  <rect class="inner" x="618" y="365" width="334" height="80" rx="6"/>
  <text class="b" x="632" y="389">Implementer feedback</text>
  <text class="m" x="632" y="408">Specification problems it met</text>
  <text class="m" x="632" y="424">Implementation decisions it made</text>
  <text class="m" x="632" y="439">each problem Open, Resolved, or Declined</text>

  <!-- 2: build or update -->
  <path class="arrow" d="M402 237 L598 237"/>
  <text class="b mid" x="500" y="211">② Build or update</text>
  <text class="code mid" x="500" y="227">build-implementation</text>
  <text class="code mid" x="500" y="256">update-implementation</text>

  <!-- 3: absorb feedback -->
  <path class="arrow" d="M616 405 L402 405"/>
  <text class="b mid" x="500" y="395">③ Absorb feedback</text>
  <text class="code mid" x="500" y="424" style="font-size: 10.5px">absorb-implementation-records</text>

  <!-- fixed-point cycle -->
  <path class="cycle" d="M540 380 C 572 350, 572 300, 540 272"/>
  <text class="m mid" x="480" y="314">repeat ②–③ until</text>
  <text class="m mid" x="480" y="330">no feedback is open</text>
  <text class="m mid" x="480" y="346">(fixed point)</text>

  <!-- footer -->
  <text class="m" x="30" y="500">Every change enters at the specifications. The Implementation changes only through ② or a conformance fix from ⑤,</text>
  <text class="m" x="30" y="518">so it can be thrown away and rebuilt from the specifications at any time.</text>
  <text class="m" x="30" y="544">First build: ① → ②.   Specification change: ① → ②.   Implementer feedback: ③ → ② until fixed point.   Designer feedback: ④ → ⑤ → ②.</text>
</svg>
