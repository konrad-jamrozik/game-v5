<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="What advanceTurn() changes when it ends Turn 8: Turn 8 gets a reduced History entry, the report of the Advance turn that ended Turn 7 is kept only in reduced form, getTurnReport() returns the full report of the new Advance turn, and getCurrentState() returns the Turn-start state of Turn 9">
  <!-- Hand-kept diagram for docs/specs/foundation/engine-contract.md; not generated. -->
  <style>
    :root { --bg: #ffffff; --surface: #ffffff; --block: #f1f4f7; --fg: #1b2330; --muted: #5b6676; --line: #d5dae2; --turn: #2f7f95; --hist: #6b5ca5; --histtint: #efecf8; --full: #2f7d4f; --fulltint: #e4f3ea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12161d; --surface: #1a2029; --block: #1a2029; --fg: #e6eaf0; --muted: #9aa5b5; --line: #323b49; --turn: #6fb3c7; --hist: #a99be0; --histtint: #241f38; --full: #6cc893; --fulltint: #173326; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .title { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .m { fill: var(--muted); }
    .mid { text-anchor: middle; }
    .code { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 12.5px; font-weight: 600; }
    .axis { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .future { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .block { fill: var(--block); stroke: var(--line); stroke-width: 1.5; }
    .blocknew { fill: var(--block); stroke: var(--turn); stroke-width: 2; }
    .entry { fill: var(--surface); stroke: var(--fg); stroke-width: 2; }
    .ring { fill: none; stroke: var(--turn); stroke-width: 1.5; }
    .start { fill: var(--surface); stroke: var(--turn); stroke-width: 2; }
    .end { fill: var(--turn); stroke: var(--turn); stroke-width: 2; }
    .reduced { fill: var(--histtint); stroke: var(--hist); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .full { fill: var(--fulltint); stroke: var(--full); stroke-width: 1.8; }
    .th { fill: var(--hist); font-weight: 600; }
    .tf { fill: var(--full); font-weight: 600; }
    .nav { fill: var(--turn); font-weight: 600; }
    .guide { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
    .lane { stroke: var(--line); stroke-width: 1; }
    .badge { fill: var(--surface); stroke: var(--turn); stroke-width: 1.5; }
  </style>
  <rect class="bg" x="0" y="0" width="1000" height="490"/>
  <text class="title" x="24" y="32">What advanceTurn() changes when it ends Turn 8</text>

  <!-- Turn labels -->
  <text class="b mid" x="272" y="82">Turn 7</text>
  <text class="b mid" x="527" y="82">Turn 8</text>
  <text class="b mid" x="760" y="82">Turn 9</text>
  <text class="nav mid" x="655" y="82">advanceTurn()</text>

  <!-- Axis -->
  <path class="axis" d="M 190 125 H 368 M 432 125 H 623 M 687 125 H 700"/>
  <path class="future" d="M 712 125 H 893"/>
  <rect class="block" x="368" y="101" width="64" height="48" rx="6"/>
  <text class="b mid" x="400" y="122">Advance</text><text class="b mid" x="400" y="138">turn</text>
  <rect class="blocknew" x="623" y="101" width="64" height="48" rx="6"/>
  <text class="b mid" x="655" y="122">Advance</text><text class="b mid" x="655" y="138">turn</text>

  <!-- Turn 7 -->
  <polygon class="start" points="190,114 201,125 190,136 179,125"/>
  <circle class="entry" cx="250" cy="125" r="7"/>
  <circle class="entry" cx="300" cy="125" r="7"/>
  <polygon class="end" points="355,115 365,125 355,135 345,125"/>
  <!-- Turn 8 -->
  <polygon class="start" points="445,114 456,125 445,136 434,125"/>
  <circle class="entry" cx="505" cy="125" r="7"/>
  <circle class="entry" cx="555" cy="125" r="7"/>
  <polygon class="end" points="610,115 620,125 610,135 600,125"/>
  <!-- Turn 9 -->
  <circle class="ring" cx="700" cy="125" r="15"/>
  <polygon class="start" points="700,114 711,125 700,136 689,125"/>
  <text class="b" x="724" y="158">current Committed state:</text><text class="b" x="724" y="174">the Turn-start state of Turn 9</text>

  <!-- Lanes -->
  <path class="lane" d="M 24 182 H 976 M 24 238 H 976 M 24 294 H 976 M 24 350 H 976"/>
  <text class="code" x="24" y="214">getHistory()</text>
  <text class="code" x="24" y="270">getTurnReport()</text>
  <text class="code" x="24" y="326">getCurrentState()</text>

  <path class="guide" d="M 179 150 V 345 M 432 150 V 345 M 623 150 V 345 M 687 150 V 345 M 700 140 V 345"/>

  <!-- getHistory() -->
  <rect class="reduced" x="179" y="193" width="253" height="34" rx="6"/>
  <text class="th mid" x="290" y="214">History entry, Turn 7 · reduced</text>
  <rect class="reduced" x="436" y="193" width="251" height="34" rx="6"/>
  <text class="th mid" x="545" y="214">History entry, Turn 8 · reduced</text>
  <circle class="badge" cx="400" cy="210" r="10"/><text class="b mid" x="400" y="214.5">2</text>
  <circle class="badge" cx="655" cy="210" r="10"/><text class="b mid" x="655" y="214.5">1</text>
  <text class="m" x="712" y="208">Entries for Turns 1 to 6 are</text>
  <text class="m" x="712" y="223">unchanged and not drawn</text>

  <!-- getTurnReport() -->
  <rect class="full" x="623" y="249" width="64" height="34" rx="6"/>
  <text class="tf mid" x="645" y="270">full</text>
  <circle class="badge" cx="674" cy="266" r="10"/><text class="b mid" x="674" y="270.5">3</text>
  <text class="m" x="712" y="264">now the Advance turn that ended Turn 8;</text>
  <text class="m" x="712" y="279">the report for Turn 7 is no longer returned</text>

  <!-- getCurrentState() -->
  <rect class="full" x="668" y="305" width="64" height="34" rx="6"/>
  <text class="tf mid" x="690" y="326">full</text>
  <circle class="badge" cx="721" cy="322" r="10"/><text class="b mid" x="721" y="326.5">4</text>
  <text class="m" x="745" y="320">Turn 9 before any Player action</text>

  <!-- Numbered changes -->
  <circle class="badge" cx="34" cy="378" r="10"/><text class="b mid" x="34" y="382.5">1</text>
  <text x="54" y="382">Turn 8 ends, so it gets a History entry: its Turn-start state, its Turn-end state, and the new Turn report, each reduced.</text>
  <circle class="badge" cx="34" cy="404" r="10"/><text class="b mid" x="34" y="408.5">2</text>
  <text x="54" y="408">The Turn report of the Advance turn that ended Turn 7 is now kept only in the reduced form inside its History entry.</text>
  <circle class="badge" cx="34" cy="430" r="10"/><text class="b mid" x="34" y="434.5">3</text>
  <text x="54" y="434">getTurnReport() returns the report of the Advance turn that just happened, in full.</text>
  <circle class="badge" cx="34" cy="456" r="10"/><text class="b mid" x="34" y="460.5">4</text>
  <text x="54" y="460">getCurrentState() returns the Turn-start state of Turn 9.</text>
  <text class="m" x="24" y="482">Each change happens in the same Advance turn, so no Committed state shows one without the others.</text>
</svg>
