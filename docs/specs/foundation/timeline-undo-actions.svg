<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Undo within one Turn: four undoAction() calls step back through four Timeline entries to the Turn-start state, and one undoAllActions() call does the same at once">
  <!-- Hand-kept diagram for docs/specs/foundation/timeline.md; not generated. -->
  <style>
    :root { --bg: #ffffff; --surface: #ffffff; --block: #f1f4f7; --fg: #1b2330; --muted: #5b6676; --line: #d5dae2; --turn: #2f7f95; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12161d; --surface: #1a2029; --block: #1a2029; --fg: #e6eaf0; --muted: #9aa5b5; --line: #323b49; --turn: #6fb3c7; }
    }
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: var(--fg); }
    .bg { fill: var(--bg); }
    .title { font-size: 14px; font-weight: 600; }
    .b { font-weight: 600; }
    .m { fill: var(--muted); }
    .mid { text-anchor: middle; }
    .nav { fill: var(--turn); font-weight: 600; }
    .axis { stroke: var(--fg); stroke-width: 1.5; fill: none; }
    .future { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .block { fill: var(--block); stroke: var(--line); stroke-width: 1.5; }
    .entry { fill: var(--surface); stroke: var(--fg); stroke-width: 2; }
    .now { fill: var(--turn); stroke: var(--turn); stroke-width: 2; }
    .ring { fill: none; stroke: var(--turn); stroke-width: 1.5; }
    .start { fill: var(--surface); stroke: var(--turn); stroke-width: 2; }
    .end { fill: var(--turn); stroke: var(--turn); stroke-width: 2; }
    .arc { fill: none; stroke: var(--turn); stroke-width: 1.8; }
    .head { fill: var(--turn); }
    .badge { fill: var(--surface); stroke: var(--turn); stroke-width: 1.5; }
    .rule { stroke: var(--line); stroke-width: 1; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="head" d="M0 1 L10 5 L0 9z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="380"/>
  <text class="title" x="24" y="32">Undo within one Turn, starting after its fourth Committed action</text>
  <text class="b mid" x="90" y="96">Turn-start state</text>
  <text class="m mid" x="90" y="112">no Timeline entry</text>
  <text class="mid" x="250" y="112">Hire an Agent</text>
  <text class="mid" x="410" y="112">Assign Agents</text>
  <text class="mid" x="570" y="112">Purchase an upgrade</text>
  <text class="b mid" x="730" y="96">current Committed state</text>
  <text class="mid" x="730" y="112">Assign Agents</text>
  <text class="b mid" x="870" y="80">Turn-end Autosave</text>
  <text class="m mid" x="870" y="96">written on Advance turn</text>
  <path class="axis" d="M 90 140 H 730"/>
  <path class="future" d="M 730 140 H 890"/>
  <rect class="block" x="890" y="113" width="86" height="54" rx="6"/>
  <text class="b mid" x="933" y="137">Advance</text>
  <text class="b mid" x="933" y="153">turn</text>
  <polygon class="start" points="90,129 101,140 90,151 79,140"/>
  <circle class="entry" cx="250" cy="140" r="7"/>
  <circle class="entry" cx="410" cy="140" r="7"/>
  <circle class="entry" cx="570" cy="140" r="7"/>
  <circle class="ring" cx="730" cy="140" r="12"/>
  <circle class="now" cx="730" cy="140" r="7"/>
  <polygon class="end" points="860,130 870,140 860,150 850,140"/>
  <path class="arc" marker-end="url(#head)" d="M 726 158 C 726 208 570 208 570 154"/>
  <path class="arc" marker-end="url(#head)" d="M 566 154 C 566 208 410 208 410 154"/>
  <path class="arc" marker-end="url(#head)" d="M 406 154 C 406 208 250 208 250 154"/>
  <path class="arc" marker-end="url(#head)" d="M 246 154 C 246 208 94 208 94 156"/>
  <path class="arc" marker-end="url(#head)" d="M 736 158 C 736 290 82 290 82 156"/>
  <circle class="badge" cx="648" cy="195" r="10"/><text class="b mid" x="648" y="199.5">1</text>
  <circle class="badge" cx="488" cy="195" r="10"/><text class="b mid" x="488" y="199.5">2</text>
  <circle class="badge" cx="328" cy="195" r="10"/><text class="b mid" x="328" y="199.5">3</text>
  <circle class="badge" cx="170" cy="195" r="10"/><text class="b mid" x="170" y="199.5">4</text>
  <text class="nav mid" x="409" y="248">undoAllActions()</text>
  <path class="rule" d="M 24 300 H 976"/>
  <polygon class="start" points="34,310 42,318 34,326 26,318"/>
  <text class="m" x="52" y="322">Turn-start state, held by the Timeline</text>
  <circle class="entry" cx="322" cy="318" r="6"/>
  <text class="m" x="338" y="322">Timeline entry: one Committed action</text>
  <circle class="badge" cx="606" cy="318" r="9"/><text class="b mid" x="606" y="322.5">1</text>
  <text class="m" x="622" y="322">to 4: successive undoAction() calls</text>
  <polygon class="end" points="34,338 42,346 34,354 26,346"/>
  <text class="m" x="52" y="350">Turn-end Autosave, owned by Saves</text>
  <text class="m" x="322" y="350">An arrow ending at a circle restores the Committed state right after that Committed action.</text>
</svg>
