id: combat_parameters
type: CombatParameters
weapon_damage_range: 0.5 # a damage roll is base damage ±50%
retreat_below_agent_rating_fraction: 0.5 # of the team's starting combat rating
retreat_at_enemy_to_agent_rating: 0.8
incapacitation_skill_fraction: 0.1
target_base_weight: 100 # an Agent's hit-chance weight for an Enemy it hits with exactly the preferred chance
target_preferred_hit_chance: 0.8 # each percentage point away from it lowers the hit-chance weight by 1
rating_base_health: 30 # the effective max health at which health neither raises nor lowers a Combatant's rating factor
rating_bonus_per_health: 0.01 # each point of effective max health above or below the base: +1% or -1%
rating_base_armor: 0 # the effective armor at which armor neither raises nor lowers a Combatant's rating factor
rating_bonus_per_armor: 0.01 # each point of effective armor above or below the base: +1% or -1%
rating_base_weapon_damage: 10 # the effective weapon damage at which it neither raises nor lowers a Combatant's rating factor
rating_bonus_per_weapon_damage: 0.02 # each point of effective weapon damage above or below the base: +2% or -2%
rating_team_size_exponent: 1.2 # a side of n Combatants able to fight is rated n ^ 0.2 times the sum of what each adds
