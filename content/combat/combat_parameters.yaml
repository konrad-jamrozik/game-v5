id: combat_parameters
type: CombatParameters
weapon_damage_range: 0.5 # a damage roll is base damage ±50%
retreat_below_agent_rating_fraction: 0.4 # of the team's starting combat rating
retreat_at_enemy_to_agent_rating: 0.9
incapacitation_skill_fraction: 0.1
target_base_weight: 100 # an Agent's hit-chance weight for an Enemy it hits with exactly the preferred chance
target_preferred_hit_chance: 0.8 # each percentage point away from it lowers the hit-chance weight by 1
rating_base_health: 30 # the max health at which the health term of a Combatant's rating factor is 1
rating_base_armor: 20 # the armor at which the armor term of a Combatant's rating factor is 1
rating_base_weapon_damage: 10 # the weapon damage at which the attack term of a Combatant's rating factor is 1
rating_team_size_exponent: 1.3 # a side of n Combatants able to fight is rated n ^ 0.3 times the sum of what each adds
rating_agent_skill_gini_penalty: 0.25 # an Agents' side's Combat rating falls by this times the Gini coefficient of its Agents' effective skill
rating_exhaustion_free_points: 70 # the exhaustion above which a Combatant's whole Combat rating starts to fall
rating_exhaustion_span: 30 # each point of exhaustion above 70 takes 1/30 of the Combat rating, so 100 takes all of it
fallback_weapon: knife # the Weapon an Agent fights with when it has no other or its rounds run out
