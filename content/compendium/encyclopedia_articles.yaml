id: guide_agency
type: EncyclopediaArticle
title: The Agency
body: >-
  You run a covert agency that hunts the factions threatening the world. Each turn you hire and assign Agents, pursue
  Leads, deploy teams to Mission sites, and buy Upgrades, then advance the turn to see what your orders achieved.
  Funding and contracting pay for it all, and every Agent you keep costs upkeep.
---
id: guide_agents
type: EncyclopediaArticle
title: Agents and Assignments
body: >-
  Every Agent has one Assignment at a time. On Standby an Agent rests and waits for orders. Contracting earns money,
  Training raises skill, an Investigation pursues a Lead, and a Mission fights at a Mission site. Wounded Agents go to
  Recovery and cannot be reassigned until they heal. Moving an Agent off its work costs it a turn in transit, so change
  Assignments with care.
---
id: guide_investigations
type: EncyclopediaArticle
title: Investigations
body: >-
  Agents assigned to a Lead form an Investigation, which gains progress each turn. Once its progress reaches a share of
  the Lead's required progress, the Lead is assessed and you learn the range in which the Investigation will complete.
  A completed Investigation reveals a Mission site. Taking Agents away loses progress, and taking them all away abandons
  the Investigation.
---
id: guide_missions
type: EncyclopediaArticle
title: Missions
body: >-
  A Mission site is a place where Enemies wait, and it expires after a number of turns. Deploy a team to it and the
  Combat is fought when the turn advances. A won Mission brings its rewards; a lost or ignored one can raise Panic.
  Tired Agents fight worse, so check exhaustion before you deploy.
---
id: guide_panic
type: EncyclopediaArticle
title: Panic
body: >-
  Panic measures how frightened the world is. Faction operations left unanswered raise it, and won Missions bring it
  down. If Panic reaches its limit, the Campaign is lost. Eliminate every Faction to win.
---
id: guide_upgrades
type: EncyclopediaArticle
title: Upgrades
body: >-
  Upgrades are permanent improvements bought with money. Each purchase raises one cap of the Agency, the weapon damage
  or health of every Agent, or how fast every Agent trains or recovers, and an Upgrade can be bought again and again
  at the same price.
---
id: field_agent_article
type: EncyclopediaArticle
title: Field agent
body: >-
  The backbone of the Agency: a trained operative who can investigate, earn money on contract, train, or fight. Every
  Agent you hire starts as a Field agent and grows through training.
subject: field_agent
---
id: initiate_article
type: EncyclopediaArticle
title: Initiate
body: >-
  A new recruit of a hostile cult, armed with a sidearm and more zeal than skill. Initiates are dangerous mainly in
  numbers.
subject: initiate
---
id: soldier_article
type: EncyclopediaArticle
title: Soldier
body: >-
  A seasoned fighter carrying a rifle, roughly a match for a newly hired Agent. Soldiers guard the places a Faction
  cannot afford to lose.
subject: soldier
---
id: cult_leader_article
type: EncyclopediaArticle
title: Cult leader
body: >-
  The heart of Red Dawn, guarded in its headquarters and armed with a heavy rifle. Only a strong, rested team should
  face the Cult leader.
subject: cult_leader
---
id: sidearm_article
type: EncyclopediaArticle
title: Sidearm
body: >-
  A compact pistol carried by every Agent and by cult Initiates. Upgrades to weapon damage make it hit harder in Agent
  hands.
subject: sidearm
---
id: rifle_article
type: EncyclopediaArticle
title: Rifle
body: A reliable long gun issued to Red Dawn Soldiers.
subject: rifle
---
id: heavy_rifle_article
type: EncyclopediaArticle
title: Heavy rifle
body: A powerful weapon reserved for the Cult leader's own hands.
subject: heavy_rifle
---
id: agent_cap_article
type: EncyclopediaArticle
title: Agent cap
body: Expands the barracks so that the Agency can employ more Agents at once.
subject: agent_cap
---
id: transport_cap_article
type: EncyclopediaArticle
title: Transport cap
body: Adds vehicles so that more Agents can be deployed to Mission sites in one turn.
subject: transport_cap
---
id: training_cap_article
type: EncyclopediaArticle
title: Training cap
body: Enlarges the training grounds so that more Agents can train at the same time.
subject: training_cap
---
id: weapon_damage_article
type: EncyclopediaArticle
title: Weapon damage
body: Better ammunition and gunsmithing make the weapons of every Agent hit harder.
subject: weapon_damage
---
id: base_health_article
type: EncyclopediaArticle
title: Base health
body: Body armor and field medicine let every Agent take more harm before going down.
subject: base_health
---
id: training_skill_gain_article
type: EncyclopediaArticle
title: Training skill gain
body: Better instructors and simulators make every Agent on Training learn faster.
subject: training_skill_gain
---
id: exhaustion_recovery_article
type: EncyclopediaArticle
title: Exhaustion recovery
body: Better quarters and rest rotations let every resting Agent shake off exhaustion faster.
subject: exhaustion_recovery
---
id: health_recovery_article
type: EncyclopediaArticle
title: Health recovery
body: A better infirmary lets every wounded Agent on Recovery heal faster.
subject: health_recovery
---
id: red_dawn_article
type: EncyclopediaArticle
title: Red Dawn
body: >-
  A violent cult that recruits in the shadows and grows bolder the longer it is left alone. Follow its members back to
  its safehouse and its headquarters, and a won raid on the headquarters ends Red Dawn for good.
subject: red_dawn
---
id: locate_red_dawn_member_article
type: EncyclopediaArticle
title: Locate Red Dawn member
body: >-
  The first thread to pull: find a Red Dawn member who can be brought in for questioning.
subject: locate_red_dawn_member
---
id: locate_red_dawn_safehouse_article
type: EncyclopediaArticle
title: Locate Red Dawn safehouse
body: The captured member has talked. Somewhere in the city, Red Dawn keeps a safehouse.
subject: locate_red_dawn_safehouse
---
id: locate_red_dawn_hq_article
type: EncyclopediaArticle
title: Locate Red Dawn HQ
body: Documents seized at the safehouse point to the headquarters of Red Dawn itself.
subject: locate_red_dawn_hq
---
id: apprehend_member_article
type: EncyclopediaArticle
title: Apprehend member
body: A Red Dawn member has been found, guarded by a few Initiates. Bring the member in.
subject: apprehend_member
---
id: raid_safehouse_article
type: EncyclopediaArticle
title: Raid safehouse
body: Storm the Red Dawn safehouse. Expect many Initiates and a Soldier in charge.
subject: raid_safehouse
---
id: raid_hq_article
type: EncyclopediaArticle
title: Raid HQ
body: The final assault on Red Dawn. Winning it eliminates the cult.
subject: raid_hq
---
id: foil_recruitment_push_article
type: EncyclopediaArticle
title: Foil recruitment push
body: Red Dawn is recruiting openly. Break up the rally before the cult grows.
subject: foil_recruitment_push
---
id: foil_sabotage_article
type: EncyclopediaArticle
title: Foil sabotage
body: Red Dawn plans to strike critical infrastructure. Stop the saboteurs before the blast.
subject: foil_sabotage
