id: mechanics_recovery
type: CompendiumArticle
category: mechanics
title: Recovery
section: Agent strength
terms: [Recovery, recovering, wounded]
body: >-
  An Agent that comes back from a Mission with lost health goes to Recovery and stays there until it is back at max
  health. You cannot send an Agent to Recovery or take it off early. A recovering Agent also rests, so its exhaustion
  falls.
formulas:
  - label: 'Health regained each turn'
    text: '{recovery.health_recovery_pct_per_turn}% of max health, plus Upgrades, rounded up to hundredths'
  - label: 'Exhaustion lost each turn'
    text: '{recovery.exhaustion_recovery_per_turn}, plus Upgrades, as on Standby'
  - label: 'First healing'
    text: 'A survivor arrives the turn after the Combat and starts to heal the turn after that'
  - label: 'At max health'
    text: 'The Agent returns to Standby at once, without transit'
  - label: 'While on Recovery'
    text: 'No orders, no income, no Training, no dismissal; upkeep is still paid'
see_also: [mechanics_health, mechanics_exhaustion, health_recovery_article, exhaustion_recovery_article]
