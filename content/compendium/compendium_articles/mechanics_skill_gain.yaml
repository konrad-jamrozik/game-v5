id: mechanics_skill_gain
type: CompendiumArticle
category: mechanics
title: Skill gain
terms: [skill gain]
body: >-
  An Agent's skill rises in two ways: by Training, and by the Experience it gains from the Missions it survives. Every
  point of Experience becomes one point of skill.
formulas:
  - label: 'Each turn of Training'
    text: '+{agent_parameters.training_skill_gain_per_turn}, plus Upgrades'
  - label: 'Each point of Experience'
    text: '+1'
see_also: [mechanics_skill, mechanics_training, mechanics_experience, training_skill_gain_article]
