title: A turn at the Agency
body: >-
  You run a covert Agency that hunts the Factions threatening the world. Each turn you hire and assign Agents, follow
  Leads, deploy teams to Mission sites, and buy Upgrades, then advance the turn to see what your orders achieved.
  Funding and Contracting pay for it all, and every Agent you keep costs upkeep.
