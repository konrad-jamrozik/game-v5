id: mechanics_factions
type: CompendiumArticle
category: mechanics
title: Factions
section: Campaign
terms: [Faction, Factions]
body: >-
  Factions are the hostile groups you are fighting. Each acts on its own, grows more active the longer it survives, and
  carries out operations that raise Panic if you do not stop them. Terminate every Faction to open the way to winning the Campaign.
formulas:
  - label: 'Activity level'
    text: 'Sets how often a Faction carries out operations and how severe they are; it rises over time and never falls'
  - label: 'Dormant'
    text: 'A Faction at a level without operations carries out none until it grows more active'
  - label: 'Timing'
    text: 'When a Faction will next grow more active or carry out an operation is hidden'
  - label: 'Eliminating a Faction'
    text: 'Complete the Terminate Lead of the Faction, which follows the interrogation of its Cult leader'
  - label: 'Once eliminated'
    text: 'No more operations; its open Mission sites are cancelled and its Leads are archived'
  - label: 'Slowing a Faction'
    text: 'Nothing slows a Faction except eliminating it'
see_also: [mechanics_faction_operations, mechanics_panic, mechanics_winning_and_losing]
