id: mechanics_combat
type: CompendiumArticle
category: mechanics
listed_under: combat
title: Combat
terms: [Combat, Combats]
body: >-
  A Combat is fought in rounds. In each round every Agent attacks once, then every Enemy still able to fight attacks
  once, the most skilled of each side first. Enemies attack any Agent able to fight, at random. Agents choose at random
  too, but favour an Enemy they are likely but not certain to hit, and one with enough health left to take a full hit.
  The Combat ends the moment one side can no longer fight, or after a round in which your team retreats.
formulas:
  - label: 'Who fights'
    text: 'Your deployed team against the Enemies at the Mission site; you give no orders once it starts'
  - label: 'Each round'
    text: "The Agents' phase, then the Enemies' phase; each Combatant able to fight takes one Combat turn and attacks once"
  - label: 'Each attack'
    text: '+{agent_parameters.exhaustion_per_attack} exhaustion for the attacker and +{agent_parameters.exhaustion_per_defense} for the defender, hit or miss'
  - label: 'End of the Combat'
    text: 'As soon as no Enemy or no Agent is able to fight, or after a round in which the team retreats'
