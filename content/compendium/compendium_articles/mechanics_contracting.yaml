id: mechanics_contracting
type: CompendiumArticle
category: mechanics
title: Contracting
section: Assignments
visible_when:
  lead_completed: contracting_opportunities
terms: [Contracting, Contracting cap]
body: >-
  Contracting sends an Agent out to work for money. It is your steady income beside funding, and it pays a little more
  for a skilled Agent and a little less for a tired one. An Agent on Contracting is away from base, so getting it back
  for a Mission takes a turn. Only as many Agents can contract at once as the Contracting cap allows.
formulas:
  - label: 'Income of one Agent each turn'
    text: '{economy.contracting_income_per_agent} × (1 + (effective skill − 100) ÷ {economy.contracting_skill_scale})'
  - label: 'Total'
    text: 'The income of every Agent on Contracting is added up, then rounded down'
  - label: 'Exhaustion'
    text: '+{agent_parameters.exhaustion_per_contracting_turn} each turn, after the income is paid'
  - label: 'Contracting cap'
    text: '0 until a Lead unlocks Contracting; then {economy.base_contracting_cap} Agents'
  - label: 'Raising the Contracting cap'
    text: 'At each operation level of Initiative Mission sites: +{economy.contracting_cap_per_initiative_level.1} the first time you win one there, then +{economy.contracting_cap_per_initiative_level.2} and +{economy.contracting_cap_per_initiative_level.3} the first time you win one there against a second and a third Faction; a second win against the same Faction adds nothing'
  - label: 'Getting there and back'
    text: 'One turn in transit each way, with no income'
see_also: [mechanics_money_and_funding, mechanics_exhaustion, mechanics_transit, contracting_opportunities_article]
