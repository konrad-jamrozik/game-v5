id: mechanics_agents
type: CompendiumArticle
category: mechanics
title: Agents
terms: [Agent, Agents]
body: >-
  Agents are the people of your Agency. Each one has skill, health, and exhaustion, carries a weapon, and has one
  Assignment at a time. You start with a small team and hire more as your money allows.
formulas:
  - label: 'Starting team'
    text: '{agent_parameters.initial_roster_size} Agents, ready for orders on the first turn'
  - label: 'A new Agent'
    text: 'Skill {field_agent.base_skill}, health {field_agent.base_health}, no exhaustion, armed with a {field_agent.weapon}'
  - label: 'A hired Agent'
    text: 'Starts on Standby and arrives next turn'
  - label: 'Killed or dismissed'
    text: 'The Agent is gone for good, and its skill with it'
see_also:
