id: mechanics_damage
type: CompendiumArticle
category: mechanics
listed_under: combat
title: Damage
terms: [damage, weapon damage, armor]
body: >-
  A hit deals damage to its target. How much depends on the weapon of the attacker, with some luck either way. The
  armor of the target absorbs the damage first, and only what armor does not absorb removes health. The weapon and the
  armor an Agent wears decide both, and an Agent whose rounds run out hits with its knife.
formulas:
  - label: 'Damage of a hit'
    text: 'A whole number from weapon damage × (1 − {combat_parameters.weapon_damage_range}), rounded up, to weapon damage × (1 + {combat_parameters.weapon_damage_range}), rounded down; each is equally likely'
  - label: 'Weapon damage of an Agent'
    text: 'That of the weapon it wears, or of its knife once its rounds run out'
  - label: 'Armor of an Agent'
    text: 'That of the armor it wears'
  - label: 'Armor of an Enemy'
    text: 'That of the armor it wears'
  - label: 'Armor in a hit'
    text: 'The damage first lowers armor, down to zero; only the rest removes health'
  - label: 'Lost armor'
    text: 'Costs no health and no effective skill, and is whole again at the start of the next Combat'
  - label: 'A miss'
    text: 'No damage'
