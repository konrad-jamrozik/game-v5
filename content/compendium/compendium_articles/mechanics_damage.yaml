id: mechanics_damage
type: CompendiumArticle
category: mechanics
title: Damage
terms: [damage, weapon damage]
body: >-
  A hit removes health from its target. How much depends on the weapon of the attacker, with some luck either way.
  Upgrades make the weapons of your Agents hit harder; an Enemy always deals the damage of the weapon it carries.
formulas:
  - label: 'Damage of a hit'
    text: 'A whole number from weapon damage × (1 − {combat_parameters.weapon_damage_range}), rounded up, to weapon damage × (1 + {combat_parameters.weapon_damage_range}), rounded down; each is equally likely'
  - label: 'Weapon damage of an Agent'
    text: 'That of its weapon, plus Upgrades'
  - label: 'A miss'
    text: 'No damage'
see_also:
  [mechanics_combat, mechanics_health, weapon_damage_article, sidearm_article, rifle_article, heavy_rifle_article]
