id: mechanics_upgrades
type: CompendiumArticle
category: mechanics
title: Upgrades
terms: [Upgrade, Upgrades]
body: >-
  Upgrades are permanent improvements bought with money. Each purchase adds a fixed amount to one thing: a cap of the
  Agency, the weapon damage or max health of every Agent, or how fast every Agent trains, rests, or heals. An Upgrade
  can be bought any number of times.
formulas:
  - label: 'Price'
    text: 'Fixed for each Upgrade; it never rises'
  - label: 'Buying again'
    text: 'Every purchase adds the same amount, without limit'
  - label: 'Caps, weapon damage, and max health'
    text: 'Raised at once'
  - label: 'Training, rest, and healing'
    text: 'Faster from the next turn'
  - label: 'Who benefits'
    text: 'Every Agent, including those hired later'
