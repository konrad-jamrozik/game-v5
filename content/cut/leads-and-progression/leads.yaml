id: locate_red_dawn_command_center
type: Lead
name: Locate Red Dawn command center
description: Find the center from which Red Dawn directs its operations.
faction: red_dawn
required_progress: 15
discovered_when:
  lead_completed: interrogate_red_dawn_commander
investigate_again: always
on_completion:
  - create_mission_site: raid_command_center
---
id: analyze_red_dawn_command_structure
type: Lead
name: Analyze Red Dawn command structure
description: Study the seized records to map how Red Dawn is commanded.
faction: red_dawn
required_progress: 8
discovered_when:
  mission_won: raid_command_center
