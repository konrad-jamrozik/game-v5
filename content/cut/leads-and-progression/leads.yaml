id: locate_red_dawn_training_facility
type: Lead
name: Locate Red Dawn training facility
description: Find the place where Red Dawn trains its fighters.
faction: red_dawn
required_progress: 10
discovered_when:
  lead_completed: interrogate_red_dawn_soldier
investigate_again: always
on_completion:
  - create_mission_site: raid_training_facility
---
id: interrogate_red_dawn_lieutenant
type: Lead
name: Interrogate Red Dawn lieutenant
description: Extract what the captured Red Dawn lieutenant knows.
faction: red_dawn
required_progress: 5
discovered_when:
  mission_won: raid_training_facility
