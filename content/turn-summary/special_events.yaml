id: welcome
type: SpecialEvent
trigger: campaign_start
title: Situation Report
text: >-
  The year is 2030. Humanity is waging a secret war against enemies numerous and unknown. You take the helm of a
  clandestine organization known as **Continuity**. Your mission is to discover, infiltrate, and neutralize the gravest
  threats to the human race.
---
id: tutorial_intro
type: SpecialEvent
trigger: tutorial_intro
title: Agency Field Manual
text: Six things to know before your first Turn.
points:
  - heading: Manage your Agents
    text: Hire Agents, assign them to investigate Leads, and deploy them to Mission sites.
    icon: agents
  - heading: Support them
    text: Send Agents to Training, buy Upgrades, and equip them as new equipment becomes available.
    icon: support
  - heading: Win the Campaign
    text: >-
      Follow the Leads to the one that ends the threat. Missions keep Panic down and the Agency funded. Lose control of
      either and the Campaign is lost.
    icon: objective
  - heading: Look for the gold
    text: >-
      Every screen has a few of these. Select one to learn about what it marks. Once opened, it stops pulsing and
      disappears a few Turns later. Everything it said stays in the Compendium under Tutorials.
    icon: bubble
  - heading: Read the records
    text: The Turn report, Charts, and History show what happened and why.
    icon: records
  - heading: Dig into the Compendium
    text: Every formula of the game, explained, for when you want to know exactly how a hit or a Lead's progress is decided.
    icon: compendium
